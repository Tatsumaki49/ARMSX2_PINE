name: Run PNACH Update

on:
  push:
    paths:
      - 'PNACH_UPDATE_TRIGGER.txt'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply PNACH importer
        run: python3 tools/update_pnach_import.py

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search.py
          git commit -m "Add PNACH to Toggle importer"
          git push
