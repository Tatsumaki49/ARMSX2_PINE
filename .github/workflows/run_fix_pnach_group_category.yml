name: Fix PNACH Group Category

on:
  push:
    paths:
      - 'PNACH_GROUP_CATEGORY_TRIGGER.txt'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix PNACH group category
        run: python3 tools/fix_pnach_group_category.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search.py
          git commit -m "Remove remaining PNACH category field"
          git push
