name: Temporary Numeric Input Update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update numeric input parsing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ast

          path = Path('search.py')
          text = path.read_text()
          tree = ast.parse(text)

          def replace_function(src, tree, name, replacement):
              nodes = [n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == name]
              if not nodes:
                  raise SystemExit(f'Function not found: {name}')
              n = nodes[0]
              lines = src.splitlines(True)
              start = n.lineno - 1
              end = n.end_lineno
              return ''.join(lines[:start]) + replacement + ''.join(lines[end:])

          replacement = '''def parse_scan_number(text, typ):
              text = str(text).strip()

              if typ in ("float", "double"):
                  return float(text)

              base = 16 if text.lower().startswith("0x") else 10
              value = int(text, base)

              limits = {
                  "byte": (0, 0xFF),
                  "word": (0, 0xFFFF),
                  "dword": (0, 0xFFFFFFFF),
                  "qword": (0, 0xFFFFFFFFFFFFFFFF),
              }

              if typ in limits:
                  lo, hi = limits[typ]
                  if not lo <= value <= hi:
                      raise ValueError(f"{typ} value must be {lo}..{hi}.")

              return value

          '''

          text = replace_function(text, tree, 'parse_scan_number', replacement)

          tree = ast.parse(text)
          marker = 'def normalize_address(item):\n'
          if marker not in text:
              raise SystemExit('normalize_address not found')
          old = '''    item["address"] = int(item["address"])
    item["type"] = str(item.get("type", "dword")).lower()
    item["value"] = item.get("value", 0)

    if item["type"] in ("float", "double"):
        item["value"] = float(item["value"])
    else:
        item["value"] = int(item["value"])
'''
          new = '''    item["address"] = parse_scan_number(item["address"], "qword")
    item["type"] = str(item.get("type", "dword")).lower()
    item["value"] = item.get("value", 0)

    if item["type"] in ("float", "double"):
        item["value"] = float(item["value"])
    else:
        item["value"] = parse_scan_number(item["value"], item["type"])
'''
          if old not in text:
              raise SystemExit('normalize_address body did not match expected current version')
          text = text.replace(old, new, 1)

          ast.parse(text)
          path.write_text(text)
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search.py
          git diff --cached --quiet || git commit -m "Support explicit hexadecimal input"
          git push
