name: Temporary Numeric Input Update

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update numeric input parsing
        run: python3 tools/update_numeric_input.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search.py
          git diff --cached --quiet || git commit -m "Support explicit hexadecimal input"
          git push
