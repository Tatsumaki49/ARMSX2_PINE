name: Remove PNACH Category

on:
  push:
    paths:
      - 'PNACH_CATEGORY_REMOVE_TRIGGER.txt'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove PNACH category
        run: python3 tools/remove_pnach_category.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search.py
          git commit -m "Remove PNACH import categories"
          git push
