name: Apply scanner all-type update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-scanner-update.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          echo cHJpbnQoImhpIikK | base64 -d > /tmp/patch_repo.py
          python3 /tmp/patch_repo.py
          python3 -m py_compile search.py web_gui.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search.py web_gui.py
          git rm .github/workflows/apply-scanner-update.yml
          git commit -m "Add all-type memory scanning"
          git push origin main
